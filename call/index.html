<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f5f4f0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self' wss://wss.vdo.ninja https://turnservers.vdo.ninja; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <title>Call</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='20' fill='%232e4d43'/%3E%3Cpath d='M19 23h18v18H19zm18 5 9-5v18l-9-5' fill='none' stroke='%23fff' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
  <script src="./vendor/vdoninja-sdk.js" defer></script>
  <script type="module" src="./app.js?v=20261023-camera"></script>
</head>
<body>
  <main id="stage" aria-label="Call">
    <section id="remote-grid" aria-label="Participants"></section>
    <section id="permissions" aria-label="Camera and microphone">
      <div class="permission-buttons">
        <button id="allow-audio" class="permission-button" type="button" data-kind="audio">
          <span class="permission-icon" data-icon="mic"></span>
          <span class="permission-label"></span>
          <span class="permission-check" aria-hidden="true"></span>
        </button>
        <button id="allow-video" class="permission-button" type="button" data-kind="video">
          <span class="permission-icon" data-icon="camera"></span>
          <span class="permission-label"></span>
          <span class="permission-check" aria-hidden="true"></span>
        </button>
      </div>
      <p id="permission-help" role="status" aria-live="polite"></p>
      <button id="skip" class="text-button" hidden></button>
    </section>
    <aside id="self" hidden>
      <video id="self-video" autoplay muted playsinline></video>
      <span id="self-off" data-icon="camera-off" hidden></span>
      <span id="self-muted" data-icon="mic-off" hidden></span>
    </aside>
    <div id="call-chrome" hidden>
      <button id="share" class="round-button share-button" type="button" data-icon="link"></button>
      <nav id="controls">
        <button id="toggle-audio" class="round-button" type="button"></button>
        <button id="toggle-video" class="round-button" type="button"></button>
        <button id="switch-camera" class="round-button" type="button" data-icon="switch-camera" hidden></button>
        <button id="hangup" class="round-button hangup" type="button" data-icon="hangup"></button>
      </nav>
    </div>
    <div id="notice" role="status" aria-live="polite" hidden>
      <span id="notice-text"></span>
      <button id="retry" class="text-button" hidden></button>
    </div>
    <button id="play" class="play-button" hidden></button>
    <section id="ended" hidden><button id="rejoin" class="rejoin-button"></button></section>
    <dialog id="share-dialog">
      <form method="dialog"><button id="close-share" class="round-button" value="close" data-icon="close"></button></form>
      <label id="link-label" for="room-link"></label>
      <input id="room-link" type="text" readonly>
      <button id="copy-link" class="rejoin-button"></button>
    </dialog>
  </main>
</body>
</html>
